base.uri=https://restful-booker.herokuapp.com

# auth
auth.username=admin
auth.password=password123

# timeouts (milliseconds)
connect.timeout=10000
read.timeout=15000

# max acceptable response time for a normal call (milliseconds)
response.time.sla=3000

# token lifetime and early-refresh buffer (seconds) - override in CI with -D
token.ttl.seconds=600
token.refresh.buffer.seconds=60

# negative-test data file: .json or .xlsx (switch with -Dtestdata.missing.fields=missing-fields.xlsx)
testdata.missing.fields=missing-fields.json
