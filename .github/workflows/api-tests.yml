name: API Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:        # "Run workflow" button on GitHub

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run regression suite
        run: mvn -B clean test -Dsuite=testng.xml

      - name: Upload Extent report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            reports/
            logs/
